name: khushhal
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_localizations:
    sdk: flutter
  intl: any
  pdf: ^3.12.0

  # Officer Portal backend integration (phone OTP + REST API calls).
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  # Declared as a directory so slide artwork can be dropped in without
  # touching this file; missing files degrade to a placeholder at runtime
  # rather than breaking the build.
  assets:
    - assets/images/